version: "3.9"

services:
  db:
    image: postgres:16
    container_name: gastro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gastro
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gastro_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: gastro_postgrest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:mysecretpassword@db:5432/gastro
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000

volumes:
  gastro_pgdata: